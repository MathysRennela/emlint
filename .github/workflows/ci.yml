name: CI

# Matrix test suite on every push to main and every PR.
# Linux-only: macOS runners bill at 10x on private repos; the release workflow
# still smoke-tests macOS before publishing a tag.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check .

      - name: Run tests with warnings as errors
        run: python -m pytest tests/ -W error -q --cov=emlint --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.repository == 'MathysRennela/emlint'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          use_oidc: true
          fail_ci_if_error: true

  cli-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Check known-good DEM exits 0
        run: emlint check examples/fixed.dem --severity error

      - name: Check known-bad DEM exits 1
        shell: bash
        run: |
          set +e
          emlint check 'error(0.1) L0'
          status=$?
          set -e
          test "$status" -eq 1

  dem-checks:
    # Merged from emlint-check.yml + emlint-nonblocking.yml: one install,
    # blocking reference-DEM gate plus non-blocking corpus lint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install emlint
        run: python -m pip install .

      - name: Check reference DEM (blocking)
        run: emlint check examples/fixed.dem --severity error

      - name: Lint regression-corpus DEMs (non-blocking)
        run: |
          start=$(date +%s)
          for dem in notes/audits/validation/raw/dems/stim_*.dem benchmarks/*.dem; do
            echo "::group::$dem"
            emlint check "$dem" || echo "findings in $dem (non-blocking)"
            echo "::endgroup::"
          done
          end=$(date +%s)
          echo "Total runtime: $((end-start))s"
