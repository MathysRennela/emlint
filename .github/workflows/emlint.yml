name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting with black
        run: black --check .

      - name: Run tests with coverage
        run: python -m pytest tests/ -W error -v --cov=emlint --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
          use_oidc: true
          # Codecov must be activated for this repository before uploads can be accepted.
          fail_ci_if_error: false

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and build tool
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Run release quality gates
        run: python -m pytest -W error -q

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel

      - name: Check known-good DEM
        run: emlint check examples/fixed.dem --severity error

      - name: Check known-bad DEM returns an error exit code
        shell: bash
        run: |
          set +e
          emlint check 'error(0.1) L0'
          status=$?
          set -e
          test "$status" -eq 1

  test-stim-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with benchmark dependencies (includes qldpc)
        run: pip install -e ".[benchmark]"

      - name: Run Stim integration tests
        run: python -m pytest tests/test_stim_integration.py -v
