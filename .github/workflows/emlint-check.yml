name: emlint DEM check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-dem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install emlint
        run: python -m pip install .

      - name: Check reference DEM
        run: emlint check benchmarks/baseline_d5_r5.dem --severity error
